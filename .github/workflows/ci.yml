name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python 3.12
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: false

      - name: Ruff lint
        run: uvx ruff@0.16.8 check .

      - name: Ruff format check
        run: uvx ruff@0.16.8 format --check .

      - name: Hook self-test
        run: uv run --no-project python hooks/hooks_selftest.py

      - name: OKF validation
        run: uv run --no-project python scripts/validate_okf.py

      - name: Link check
        run: uv run --no-project python scripts/check_links.py

      - name: Routing is current
        run: uv run --no-project python scripts/check_routing.py

      - name: Frontmatter audit
        run: uv run --no-project python scripts/frontmatter_audit.py

      - name: Skill drift check
        run: uv run --no-project python scripts/drift_check.py
